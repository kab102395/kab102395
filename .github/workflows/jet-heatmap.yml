name: Update jet heatmap SVG

on:
  push:
    branches:
      - main
    paths-ignore:
      - "github-jet.svg"
  schedule:
    # Runs daily at 05:30 UTC
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Live GitHub Jet SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: github-jet.svg
        run: node generate.mjs

      - name: Personalize inherited HUD labels
        run: |
          sed -i 's/LVL 42 · AIML ARCHITECT/LVL 42 · SOFTWARE ENGINEER/g' github-jet.svg
          sed -i 's/SECTOR: PRATIK-FORGE/SECTOR: KAB102395/g' github-jet.svg

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update live jet heatmap SVG [skip ci]"
          file_pattern: "github-jet.svg"
