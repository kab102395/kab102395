name: Update jet heatmap SVG

on:
  push:
    branches:
      - main
    paths-ignore:
      - "github-jet.svg"
      - "dist/github-jet.svg"
  schedule:
    # Runs daily at 05:30 UTC
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Live GitHub Jet SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: dist/github-jet.svg
        run: node generate.mjs

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update live jet heatmap SVG [skip ci]"
          file_pattern: "dist/github-jet.svg github-jet.svg"
