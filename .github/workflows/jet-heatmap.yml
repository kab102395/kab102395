name: Update stateful profile game

on:
  push:
    branches:
      - main
    paths-ignore:
      - "github-jet.svg"
      - "game-state.json"
  schedule:
    # Daily settlement after GitHub's contribution day has closed in UTC.
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-game-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify progression rules
        run: node --test tests/game-profile.test.mjs

      - name: Generate stateful GitHub profile game
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: github-jet.svg
          STATE_PATH: game-state.json
        run: node game-profile.mjs

      - name: Restore dual-hull interceptor artwork and combat
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          OUTPUT_PATH: github-jet.svg
        run: node upgrade-ship.mjs

      - name: Animate fire-control reticle locks
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          OUTPUT_PATH: github-jet.svg
        run: node reticle-lock.mjs

      - name: Commit generated game state and SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): advance game state [skip ci]"
          file_pattern: "github-jet.svg game-state.json"
