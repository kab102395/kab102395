<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="586" viewBox="0 0 1180 586">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="1" stop-color="#02060d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#38bdf8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:'Courier New',Consolas,monospace}
      .muted{fill:#64748b}
      .key{fill:#4ade80;font-weight:700}
      .value{fill:#e2e8f0}
      .cyan{fill:#67e8f9}
      .blue{fill:#93c5fd}
      .tiny{font-size:13px;letter-spacing:1px}
      .body{font-size:18px}
      .head{font-size:24px;font-weight:700}
    </style>
  </defs>

  <rect width="1180" height="586" rx="18" fill="url(#bg)"/>
  <rect width="1180" height="586" rx="18" fill="url(#grid)"/>
  <rect x="3" y="3" width="1174" height="580" rx="16" fill="none" stroke="url(#edge)" stroke-width="2" opacity="0.85"/>

  <g class="mono">
    <rect x="3" y="3" width="1174" height="40" rx="16" fill="#081321" fill-opacity="0.96"/>
    <circle cx="26" cy="23" r="5" fill="#ef4444"/>
    <circle cx="45" cy="23" r="5" fill="#f59e0b"/>
    <circle cx="64" cy="23" r="5" fill="#10b981"/>
    <text x="590" y="28" text-anchor="middle" class="tiny" fill="#86efac">kyle@github ~ % ./profile.sh --live</text>
    <circle cx="1072" cy="23" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="1083" y="27" class="tiny" fill="#86efac">ONLINE</text>

    <rect x="28" y="70" width="355" height="468" rx="14" fill="#07101c" fill-opacity="0.8" stroke="#164e63"/>
    <text x="52" y="103" class="tiny cyan">SYSTEM.IDENTITY</text>
    <text x="52" y="152" font-size="58" font-weight="700" fill="#22d3ee" filter="url(#glow)">KAB</text>
    <text x="52" y="184" class="body value">Kyle A. Barrett</text>
    <text x="52" y="216" class="body muted">Software Engineer</text>

    <text x="52" y="273" class="tiny key">FOCUS</text>
    <text x="52" y="303" class="body value">Oracle APEX / PL/SQL</text>
    <text x="52" y="331" class="body value">Systems &amp; backend engineering</text>
    <text x="52" y="359" class="body value">Mobile application development</text>

    <text x="52" y="416" class="tiny key">MODE</text>
    <text x="52" y="446" class="body value">build · debug · ship · learn</text>
    <text x="52" y="498" class="tiny muted">github.com/kab102395</text>

    <rect x="410" y="70" width="742" height="468" rx="14" fill="#07101c" fill-opacity="0.72" stroke="#14532d"/>
    <text x="438" y="103" class="tiny key">SYSTEM.INFO</text>

    <text x="438" y="145" class="body key">Subject</text><text x="582" y="145" class="body muted">................</text><text x="790" y="145" class="body value">Kyle A. Barrett</text>
    <text x="438" y="179" class="body key">Role</text><text x="582" y="179" class="body muted">...................</text><text x="790" y="179" class="body value">Software Engineer</text>
    <text x="438" y="213" class="body key">Primary</text><text x="582" y="213" class="body muted">................</text><text x="790" y="213" class="body value">Oracle APEX · PL/SQL</text>
    <text x="438" y="247" class="body key">Languages</text><text x="582" y="247" class="body muted">..............</text><text x="790" y="247" class="body value">Rust · Python · Java · JS/TS</text>
    <text x="438" y="281" class="body key">Platform</text><text x="582" y="281" class="body muted">...............</text><text x="790" y="281" class="body value">Oracle DB · REST · Android</text>
    <text x="438" y="315" class="body key">Workflow</text><text x="582" y="315" class="body muted">...............</text><text x="790" y="315" class="body value">Git · GitHub Actions · VS Code</text>

    <text x="438" y="374" class="tiny cyan">CURRENT.STATE</text>
    <text x="438" y="409" class="body value">Engineering practical software across</text>
    <text x="438" y="438" class="body value">database, backend, mobile, and systems layers.</text>

    <text x="438" y="489" class="tiny key">LIVE.GITHUB</text>
    <text x="582" y="489" class="body value">@kab102395</text>
    <rect x="438" y="510" width="10" height="18" fill="#22c55e"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
